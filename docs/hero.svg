<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-label="BooWho? — drop a selfie, Boo figures out who you should be for Halloween">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1850"/>
      <stop offset="1" stop-color="#150924"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.3" cy="0" r="0.7">
      <stop offset="0" stop-color="#c9a3ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c9a3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.85" cy="1" r="0.6">
      <stop offset="0" stop-color="#ff8a3c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#150924" flood-opacity="0.55"/>
    </filter>
    <filter id="ds-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="0" flood-color="#150924" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="520" fill="url(#bg-grad)"/>
  <rect width="1280" height="520" fill="url(#warm)"/>
  <rect width="1280" height="520" fill="url(#ember)"/>

  <!-- Twinkly stars (small dots) -->
  <g fill="#ffd86b">
    <circle cx="60"   cy="80"  r="2.5"/>
    <circle cx="180"  cy="40"  r="1.8"/>
    <circle cx="270"  cy="120" r="2"/>
    <circle cx="400"  cy="60"  r="1.6"/>
    <circle cx="540"  cy="90"  r="2.4"/>
    <circle cx="660"  cy="30"  r="1.8"/>
    <circle cx="780"  cy="80"  r="2.2"/>
    <circle cx="900"  cy="50"  r="1.6"/>
    <circle cx="1020" cy="120" r="2.4"/>
    <circle cx="1140" cy="60"  r="2"/>
    <circle cx="1230" cy="100" r="1.6"/>
    <circle cx="120"  cy="450" r="2"/>
    <circle cx="320"  cy="480" r="1.8"/>
    <circle cx="540"  cy="460" r="2.2"/>
    <circle cx="780"  cy="490" r="1.8"/>
    <circle cx="1100" cy="450" r="2"/>
    <circle cx="1240" cy="470" r="1.8"/>
  </g>

  <!-- Candy corn 1 (top left) -->
  <g transform="translate(80,160) rotate(-18)" filter="url(#ds-sm)">
    <path d="M0 -34 L-12 22 L12 22 Z"  fill="#ffd86b" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-7 -2 L7 -2 L12 22 L-12 22 Z" fill="#fff4e0"/>
    <path d="M-9 12 L9 12 L12 22 L-12 22 Z" fill="#ff8a3c" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Star sticker -->
  <g transform="translate(220,360) rotate(-10)" filter="url(#ds-sm)">
    <path d="M0 -28 L8 -8 L30 -6 L13 8 L19 28 L0 17 L-19 28 L-13 8 L-30 -6 L-8 -8 Z"
          fill="#c9a3ff" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Bat -->
  <g transform="translate(1080,170) rotate(8)" filter="url(#ds-sm)">
    <path d="M0 -2 Q -8 -10 -16 -8 Q -24 -10 -28 -2 Q -24 6 -16 6 L -16 10 Q -8 6 -4 10 Q -4 14 -6 16 L 0 14 L 6 16 Q 4 14 4 10 Q 8 6 16 10 L 16 6 Q 24 6 28 -2 Q 24 -10 16 -8 Q 8 -10 0 -2 Z"
          fill="#2a1b3d" stroke="#2a1b3d" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-4" cy="2" r="1.5" fill="#c9a3ff"/>
    <circle cx="4"  cy="2" r="1.5" fill="#c9a3ff"/>
  </g>

  <!-- Sparkle -->
  <g transform="translate(950,400)" filter="url(#ds-sm)">
    <path d="M0 -22 L4 -4 L22 0 L4 4 L0 22 L-4 4 L-22 0 L-4 -4 Z"
          fill="#7fe0c7" stroke="#2a1b3d" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Moon -->
  <g transform="translate(1170,360) rotate(-22)" filter="url(#ds-sm)">
    <path d="M14 -16 A22 22 0 1 0 22 28 A18 18 0 1 1 14 -16 Z"
          fill="#ffd86b" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Spider -->
  <g transform="translate(360,160)" filter="url(#ds-sm)">
    <path d="M-18 -10 L-8 -2" stroke="#2a1b3d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-22 0 L-8 0"  stroke="#2a1b3d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-18 10 L-8 4" stroke="#2a1b3d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 -10 L8 -2" stroke="#2a1b3d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 0 L8 0"   stroke="#2a1b3d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 10 L8 4"  stroke="#2a1b3d" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#2a1b3d"/>
    <circle cx="-2" cy="-1" r="1.5" fill="#ff8a3c"/>
    <circle cx="2"  cy="-1" r="1.5" fill="#ff8a3c"/>
  </g>

  <!-- Candy corn 2 (top right) -->
  <g transform="translate(1100,80) rotate(20)" filter="url(#ds-sm)">
    <path d="M0 -28 L-10 18 L10 18 Z"  fill="#ffd86b" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-6 -2 L6 -2 L10 18 L-10 18 Z" fill="#fff4e0"/>
    <path d="M-8 10 L8 10 L10 18 L-10 18 Z" fill="#ff8a3c" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Boo the ghost (centered slightly left) -->
  <g transform="translate(290,210) scale(2.4)" filter="url(#ds)">
    <!-- body -->
    <path d="M 60 8
             C 36 8 22 26 22 50
             L 22 110
             Q 28 124 38 114
             Q 48 104 60 114
             Q 72 124 82 114
             Q 92 104 98 110
             L 98 50
             C 98 26 84 8 60 8 Z"
          fill="#fff4e0" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
    <!-- cheeks -->
    <ellipse cx="36" cy="68" rx="5" ry="3.5" fill="#ffb3c8" opacity="0.9"/>
    <ellipse cx="84" cy="68" rx="5" ry="3.5" fill="#ffb3c8" opacity="0.9"/>
    <!-- eyes -->
    <ellipse cx="45" cy="52" rx="5.5" ry="7" fill="#2a1b3d"/>
    <ellipse cx="75" cy="52" rx="5.5" ry="7" fill="#2a1b3d"/>
    <circle cx="46.5" cy="50" r="1.4" fill="#fff4e0"/>
    <circle cx="76.5" cy="50" r="1.4" fill="#fff4e0"/>
    <!-- happy mouth -->
    <path d="M 50 76 Q 60 88 70 76" stroke="#2a1b3d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(580,260)">
    <text font-family="'Fredoka', 'Trebuchet MS', 'Helvetica Rounded', system-ui, sans-serif"
          font-weight="700"
          font-size="156"
          letter-spacing="-2">
      <tspan fill="#fff4e0">Boo</tspan><tspan fill="#ff8a3c">Who</tspan><tspan fill="#c9a3ff">?</tspan>
    </text>

    <text y="68"
          font-family="'Fredoka', 'Trebuchet MS', system-ui, sans-serif"
          font-weight="500"
          font-size="26"
          fill="#fff4e0"
          opacity="0.78">
      Drop a selfie. Boo figures out who you should be for Halloween.
    </text>
  </g>

  <!-- Bottom candy stripe -->
  <g>
    <rect x="0" y="500" width="1280" height="20" fill="#ff8a3c"/>
    <rect x="0" y="500" width="1280" height="20" fill="url(#stripe)" opacity="0"/>
  </g>
</svg>
